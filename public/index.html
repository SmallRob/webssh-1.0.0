></head><body><noscript><strong>Please enable javascript to use.</strong></noscript><div id="app"></div><style>/* ===== 主题修复：亮色淡蓝背景 / 暗黑全页黑背景 ===== */
body,#app{background:#e6f0fa !important;}
.login-container{background:#e6f0fa !important;}
.card{background:#fdfeff !important;}
html.dark-theme body,html.dark-theme #app{background:#161a22 !important;}
html.dark-theme .login-container{background:#161a22 !important;}

html.dark-theme #quick-servers .qs-btn:hover{border-color:#409eff;color:#66b1ff;}</style><script>(function(){
  /* 同步 .dark-theme 到 <html>，使 body/#app 背景跟随暗黑模式
     注意：必须在 body 内查询，否则会匹配到 html 自身造成自举锁死 */
  function syncTheme(){
    var dark=!!(document.body && document.body.querySelector('.dark-theme'));
    document.documentElement.classList.toggle('dark-theme',dark);
  }
  new MutationObserver(syncTheme).observe(document.body,{attributes:true,attributeFilter:['class'],subtree:true,childList:true});
  if(document.readyState!=='loading'){syncTheme();}
  else{document.addEventListener('DOMContentLoaded',syncTheme);}
})();</script><script>/* ===== 快捷服务器选择（配置由 /servers 接口动态提供，改挂载的 servers.json 即时生效） ===== */
(function(){
  var style=document.createElement('style');
  style.textContent='#quick-servers{max-width:860px;margin:12px auto 0;padding:0 20px;font-family:inherit}'
  +'#quick-servers .qs-title{font-size:13px;opacity:.65;margin-bottom:8px}'
  +'#quick-servers .qs-list{display:flex;flex-wrap:wrap;gap:8px}'
  +'#quick-servers .qs-btn{cursor:pointer;border:1px solid rgba(128,128,128,.4);border-radius:6px;background:transparent;color:inherit;padding:6px 14px;font-size:13px;line-height:1.4;text-align:left;transition:all .2s}'
  +'#quick-servers .qs-btn:hover{border-color:#409eff;color:#409eff;box-shadow:0 2px 8px rgba(64,158,255,.25)}'
  +'#quick-servers .qs-btn b{display:block;font-size:14px}'
  +'#quick-servers .qs-btn span{opacity:.6;font-size:12px}';
  document.head.appendChild(style);
  function setNative(el,v){var p=Object.getOwnPropertyDescriptor(el.__proto__,'value');if(p&&p.set){p.set.call(el,v)}else{el.value=v}el.dispatchEvent(new Event('input',{bubbles:true}));}
  /* 快捷列表中的主机都是 SSH 目标：若当前协议不是 SSH，先切回 SSH，
     避免「选了 RDP/VNC 后点快捷连接」把 SSH 目标当成远程桌面去连。 */
  function ensureSsh(){
    var items=document.querySelectorAll('.protocol-item');
    for(var i=0;i<items.length;i++){
      var name=items[i].querySelector('.protocol-name');
      if(name&&name.textContent.trim().toUpperCase()==='SSH'){
        if(!items[i].classList.contains('is-active')){items[i].click();}
        return;
      }
    }
  }
  function fillForm(s){
    var card=document.querySelector('.card');if(!card)return false;
    var inputs=card.querySelectorAll('input.el-input__inner');
    var host=null,port=null,user=null,pass=null;
    inputs.forEach(function(i){var ph=i.getAttribute('placeholder')||'';
      if(ph.indexOf('主机地址')>-1)host=i;else if(ph.indexOf('端口')>-1)port=i;
      else if(ph.indexOf('用户名')>-1)user=i;else if(ph.indexOf('密码')>-1&&i.type==='password')pass=i;});
    if(!host||!user)return false;
    ensureSsh();
    setNative(host,s.host||'');if(port)setNative(port,s.port||22);
    setNative(user,s.username||'');if(pass&&s.password)setNative(pass,s.password);
    return true;
  }
  function render(list){
    if(!list||!list.length)return;
    var box=document.createElement('div');box.id='quick-servers';
    var html='<div class="qs-title">快捷连接 (Quick Connect)</div><div class="qs-list">';
    list.forEach(function(s){html+='<button type="button" class="qs-btn" data-i="'+encodeURIComponent(JSON.stringify(s))+'"><b>'+s.name+'</b><span>'+s.username+'@'+s.host+':'+(s.port||22)+'</span></button>'});
    html+='</div>';box.innerHTML=html;
    box.addEventListener('click',function(e){
      var btn=e.target.closest('.qs-btn');if(!btn)return;
      var s=JSON.parse(decodeURIComponent(btn.getAttribute('data-i')));
      var tries=0;(function tryFill(){if(!fillForm(s)&&tries++<20){setTimeout(tryFill,100)}})();
    });
    var card=document.querySelector('.card');
    if(card){card.parentNode.insertBefore(box,card.nextSibling);}
    else{
      /* Vue 尚未渲染登录卡片时等待其出现，保证按钮显示在正确位置 */
      var mo=new MutationObserver(function(){
        var c=document.querySelector('.card');
        if(c){mo.disconnect();c.parentNode.insertBefore(box,c.nextSibling);}
      });
      mo.observe(document.body,{childList:true,subtree:true});
    }
  }
  fetch('/servers').then(function(r){return r.json()}).then(render).catch(function(){});
})();</script><script src="/static/js/chunk-elementUI-59f3426a.af2dc2f4.js"></script><script src="/static/js/chunk-elementUI-4b7bae34.1510df99.js"></script><script src="/static/js/chunk-elementUI-fe785c75.3de222ec.js"></script><script src="/static/js/chunk-elementUI-68386f39.2e3b24c1.js"></script><script src="/static/js/chunk-elementUI-2ea58815.4f555f40.js"></script><script src="/static/js/chunk-elementUI-62ee4a0c.06f21a93.js"></script><script src="/static/js/chunk-vendors-253ae210.d3858de4.js"></script><script src="/static/js/chunk-vendors-d939e436.2347544b.js"></script><script src="/static/js/chunk-vendors-b58f7129.bf4da408.js"></script><script src="/static/js/chunk-vendors-1c3a2c3f.62475d1d.js"></script><script src="/static/js/chunk-vendors-8f85cd76.1de9d7db.js"></script><script src="/static/js/chunk-vendors-2900d54e.bc2c6998.js"></script><script src="/static/js/app-d0ae3f07.e06beaeb.js"></script></body></html>
