<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>WebSSH Console</title>
    <meta name="description" content="最好用的webSSH终端管理工具">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="/static/img/favicon.ico">
  </head>
  <body>
    <noscript>
      <strong>Please enable javascript to use.</strong>
    </noscript>
    <div id="app"></div>
    <style>
/* ===== 主题修复：亮色淡蓝背景 / 暗黑全页黑背景 ===== */
body,#app{background:#e6f0fa !important;}
.login-container{background:#e6f0fa !important;}
.card{background:#fdfeff !important;}
html.dark-theme body,html.dark-theme #app{background:#161a22 !important;}
html.dark-theme .login-container{background:#161a22 !important;}
html.dark-theme .card{background:#232a34 !important;}
</style><script>
(function(){
  /* 同步 .dark-theme 到 <html>，使 body/#app 背景跟随暗黑模式
     注意：必须在 body 内查询，否则会匹配到 html 自身造成自举锁死 */
  function syncTheme(){
    var dark=!!(document.body && document.body.querySelector('.dark-theme'));
    document.documentElement.classList.toggle('dark-theme',dark);
  }
  new MutationObserver(syncTheme).observe(document.body,{attributes:true,attributeFilter:['class'],subtree:true,childList:true});
  if(document.readyState!=='loading'){syncTheme();}
  else{document.addEventListener('DOMContentLoaded',syncTheme);}
})();
</script>
  </body>
</html>
